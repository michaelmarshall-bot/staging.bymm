    <style>
        /* Base Layout */

        .scroll-container {
            position: relative;
            display: block;
            overflow: clip;
            min-height: 100vh;
        }

        .hero-section {
            width: 100%;
            height: 100%;
            min-height: 100vh; 
            bottom: 0;
            position: relative;
            display: grid;
            place-items: center;
            z-index: 8;
        }

        .hero-title {
            text-align: center;
            color: var(--hed-colour);
            z-index: 10;
            max-width: 80vw;
            margin: 0;
            text-transform: none;
            border: 1px solid var(--lcd-glow-color);
            box-shadow: 0 0 1px 1px rgba(0, 0, 0, 0.5); 
            padding: 1.5rem 1rem;
            font: var(--font-body);
            font-family: var(--hed-type);
            font-weight: 900;
            text-transform: uppercase; 
            letter-spacing: calc(var(--hed-letterspace) + 1px);
            font-size: clamp(1rem, 2vw, 2rem);
            background-color: var(--bg-main);
            position: fixed;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            animation: 
                glitchLoad 6s ease-in-out none 1;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        

        .hero-fade {
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateZ(0);
            width: 100%;
            height: 100%;
            min-height: 100vh;
            z-index: 9;
            pointer-events: none;
            will-change: transform;
        }

        /* Safari-friendly filter separation */
        .hero-fade::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0) 100vh, var(--bg-main) 25%, var(--bg-main) 100%);
            /*filter: url(#pixelNoise);*/
        }

        .hero-title > span {
            font: var(--font-body);
            text-transform: none;
            letter-spacing: initial;
            margin-top: var(--block-margin);
        }

        @media  (min-width: 580px) {
             .hero-title {
                padding: 1.5rem 2rem;
             }

            .hero-title > span {
                margin-top: 0px;
            }
        }

        .hero-section p {
            /*display: inline-block;*/
            text-align: end;
            padding: 0px;
            color: var(--hed-colour);
        }

        .floating-logo {
            position: fixed;
            height: clamp(30px, 5vw, 50px);
            width: auto;
            max-width: 200px;
            color: var(--hed-colour);
            opacity: 1;
            z-index: 8;
            transform: translate(-50%, -50%);
            transition: transform 0.2s ease, opacity 0.3s ease;
            animation: 
                glitchLoad 6s ease-in-out none 1;
        }

        .floating-logo:hover {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* Ensure SVG paths inherit the brand colour */
        .floating-logo path {
            fill: currentColor;
        }

        #IMFTLogo {
            filter: grayscale(100%) contrast(100%);
        }

        /*Hero Glitch Animation*/

        @keyframes glitchLoad {
        50% {
            -webkit-filter: url(#glitchHover); 
            filter: url(#glitchHover);
        }
        }
        
        @keyframes glitchRepeat {
            0%, 100% { filter: none; }
            50% { filter: url(#glitchHover); }
        }

        .is-flickering {
            animation: glitchRepeat 1s linear infinite;
        }

        /*Design Module*/

        .testimonial-wrapper {
            background: none;
            border: none;
            margin: 0rem 0;
            flex-wrap: wrap;
        }

        .testimonial-section {
            margin-top: 140vh;
            padding: 10px 0;
            margin-bottom: 25vh;
        }


        .testimonial-section .slideArrow {
            border: solid 2px var(--hed-colour);
        }

        .testimonial-section .slide {
            min-width: 0%;
            padding: 1vh 0vw;
        }

        .testimonial-section .card {
            border: solid 2px var(--hed-colour);
        }

        .mockTitle h2 {
            position: relative;
            font: var(--h2-styles);
            font-size: clamp(1.618em, 6vw, 1.618em);
            letter-spacing: calc(var(--hed-letterspace) + 1px);
            background: var(--bg-main);
            background-repeat: no-repeat;
            background-position: center;
             background-size: auto calc(100% - 20px);
            color: var(--hed-colour);
            border: solid 2px var(--hed-colour);
            padding: 60% 0.2rem 0.2rem 0.2rem;
            text-align: center;
            align-self: center;
            margin: var(--block-margin);
            max-width: 600px;
            width: 90vw;
            display: none;
            white-space: nowrap;
            text-wrap: nowrap;
            -webkit-touch-callout: none; /* iOS Safari */
            -webkit-user-select: none;   /* Safari, Chrome, Opera */
            -moz-user-select: none;      /* Firefox */
            -ms-user-select: none;       /* Internet Explorer/Edge */
            user-select: none;           /* Standard syntax */
        }

        @media (hover: hover) {

        .testimonial-wrapper .slideArrow:hover {
            filter: url(#glitchHover);
        }

        .testimonial-wrapper:has(h2:hover) .slideArrow {
            transform: translateY(-50%) scale(1.2);
            filter: url(#glitchHover);
        }

        .testimonial-wrapper:has(.card:hover) .slideArrow {
            transform: translateY(-50%) scale(1.2);
            filter: url(#glitchHover);
        }


        .mockTitle h2:hover {
            color: hsl(var(--card-hue), 70%, 60%);
            filter: url(#glitchHover);
        }

        .mockTitle h2:hover span {
            color: hsl(var(--card-hue), 70%, 60%);
            text-indent: 150%;
            filter: url(#glitchHover);
        }

        .testimonial-section .card:hover {
            filter: none;
        }

        }

        .testimonial-wrapper h2 > span:nth-of-type(1) {
            display: none;
        }

        .testimonial-wrapper h2 > span:nth-of-type(2) {
            display: inline;
        }

        .mobDivider {
            display: none;
            margin: auto;
            width: 88vw;
            height: 0px;
            border: var(--border-std);
        }

        @media screen and (min-width: 640px) {
            .testimonial-section {
                padding: 10vh 0;
            }

            .slider-container {
                display: flex;
                flex-direction: row; /* Force all rows to standard left-to-right */
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                scroll-behavior: smooth;
                -webkit-overflow-scrolling: touch;
            }
            
            .mockTitle h2 {   
                text-align: left;
                align-self: start;
                padding: calc(((var(--type-ratio) * (1.618 * 3))) * 1rem) 0.2rem 0.2rem 0.2rem;
            }

        }

        @media (min-width: 1024px) {
            .slider-container {
                padding: 0 0vw;
                scroll-padding: 0 0vw;
            }

            .mockTitle h2 {
                display: flex;
            }
        }
        
        .testimonial-section .card > :nth-child(3) {
            flex-direction: column;
        }

        .testimonial-section .card > :nth-child(1):empty {
            content: "";
            height: 16px;
        }

        .testimonial-section .card .mockImg:has(img) {
            padding: 0px;
        }

        .mockImg img {
           width: 100%;
           height: 100%;
           display: block;
        }

        .wideImg img {
            max-height: 100%;
            max-width: 90vw;
        }

        @media screen and (min-width:700px) {

        .slide:has(.wideImg) {
            min-height: 100%;
        }
            
        .card:has(.wideImg) {
            max-width: none;
            width: fit-content;
        }

        .card:has(.wideImg) > :nth-child(even) {
            max-width: 100%;
        }
        }

        .mockImg path {
            fill: currentColor;
        }

        .mockImg svg {
            margin: 2em;
            max-width: 500px;
            fill: var(--hed-colour);
        }

        .testimonial-section .slide {
            align-self: center;
        }

       .testimonial-section .slide:nth-child(1) .mockImg svg {
            margin: 2em 2em 1em 2em;
            max-width: 500px;
            fill: var(--hed-colour);
        }

        .testimonial-section .card > div > p > span {
            font: var(--font-detail);
        }

        .mockImg > blockquote {
            margin: 0px 0px -0.4em -0.1em;
        }

        .imgCaption > p > span:empty::after {
            content: "\2014";
            font: var(--font-body);
        }

        /*Design Context Block*/

        .contextBlock {
            flex-basis: 100%;
            margin: auto;
        }

        .contextCard {
            flex-wrap: wrap;
            display: flex;
            align-items: end;
            background: var(--bg-main);
            margin: auto;
            border: var(--border-std);
        }

        .contextCard h2 {
            font: var(--h2-styles);
            padding: var(--h2-pad);
            text-align: var(--type-align);
            letter-spacing: var(--hed-letterspace);
            line-height: var(--hero-lineheight);
        }

        .contextCard p {
            max-width: 550px;
            padding: var(--p-padding);
            align-self: center;
            margin: auto;
        }

        @media screen and (min-width: 550px) {
            .contextCard {
                max-width: 90vw;
            }
            .contextCard h2 {
                display: block;
                width: 0px;
            }
        }
        
        @media screen and (min-width: 622px) {
            .contextCard h2 {
                padding: 0;
            }

            .contextCard p {
                padding-top: calc(var(--p-padding-top) * 2);
                padding-bottom: calc(var(--p-padding-top) * 2);
            }
        }

        .hardware-track {
            display: none;
            /*Temporary until solution is found*/
        }

        .date-box {
          background: transparent;

        }

        .intervals {
          position: relative;
          border-bottom: 2px black solid;
          display: inline-block;
        }

        .labels  {
            position: relative;
            font: var(--font-detail);
            font-weight: 200;

        </svg>
        <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
            <filter id="pixelNoise" x="0" y="0">
                <!-- Block -->
                <feFlood x="4" y="4" height="1" width="1"/>
                <!-- 2. Grid Size -->
                <feComposite width="5" height="5"/>
                <!-- Point Name-->
                <feTile result="a"/>
